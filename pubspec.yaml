name: nura_app
description: Nura — original audio discovery app, Flutter port of the user prototype.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_soloud: ^4.0.7
  supabase_flutter: ^2.12.4
  palette_generator: ^0.3.3+7
  async: ^2.13.1
  audio_session: ^0.2.3
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  flutter_audio_toolkit: ^1.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.7
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logo_nura_app.jpeg
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/branding/
    - assets/images/artists/
    - assets/images/labels/
    - assets/images/categories/
  shaders:
    - shaders/liquid_glass.frag
